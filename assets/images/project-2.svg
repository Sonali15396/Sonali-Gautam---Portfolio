<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="p2Shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="360" fill="#0b0f19" />
  
  <g stroke="#1e293b" stroke-width="0.75">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>

  <!-- Browser Window Frame Mockup -->
  <g transform="translate(40, 30)" filter="url(#p2Shadow)">
    <rect width="520" height="300" rx="14" fill="#111827" stroke="#374151" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M0 14 C0 6.27 6.27 0 14 0 L506 0 C513.73 0 520 6.27 520 14 L520 38 L0 38 Z" fill="#030712" />
    <circle cx="24" cy="19" r="5" fill="#ef4444" />
    <circle cx="42" cy="19" r="5" fill="#eab308" />
    <circle cx="60" cy="19" r="5" fill="#22c55e" />
    <text x="85" y="23" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f3f4f6">TaskFlow AI — Sprint Board</text>

    <!-- App Top Bar -->
    <rect x="20" y="48" width="480" height="32" rx="6" fill="#1f2937" />
    <text x="32" y="68" font-family="sans-serif" font-weight="bold" font-size="12" fill="#c084fc">⚡ AI Sprint 24: In Progress</text>
    <rect x="420" y="54" width="70" height="20" rx="4" fill="url(#p2Grad)" />
    <text x="432" y="68" font-family="sans-serif" font-weight="bold" font-size="9" fill="#ffffff">+ NEW TASK</text>

    <!-- Kanban Columns -->
    <!-- Col 1: To Do -->
    <g transform="translate(20, 92)">
      <rect width="150" height="190" rx="8" fill="#182234" />
      <text x="12" y="22" font-family="sans-serif" font-weight="bold" font-size="10" fill="#94a3b8">TO DO (3)</text>
      <!-- Card 1 -->
      <rect x="8" y="32" width="134" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="16" y="42" width="50" height="12" rx="3" fill="#3b82f6" opacity="0.3" />
      <text x="20" y="51" font-family="sans-serif" font-size="8" fill="#60a5fa">FRONTEND</text>
      <text x="16" y="68" font-family="sans-serif" font-weight="bold" font-size="9" fill="#f8fafc">Refactor auth context</text>
      <rect x="16" y="78" width="60" height="6" rx="3" fill="#64748b" />

      <!-- Card 2 -->
      <rect x="8" y="105" width="134" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="16" y="115" width="45" height="12" rx="3" fill="#10b981" opacity="0.3" />
      <text x="20" y="124" font-family="sans-serif" font-size="8" fill="#34d399">DESIGN</text>
      <text x="16" y="141" font-family="sans-serif" font-weight="bold" font-size="9" fill="#f8fafc">Theme palette review</text>
    </g>

    <!-- Col 2: In Progress -->
    <g transform="translate(185, 92)">
      <rect width="150" height="190" rx="8" fill="#182234" />
      <text x="12" y="22" font-family="sans-serif" font-weight="bold" font-size="10" fill="#c084fc">IN PROGRESS (2)</text>
      <!-- Active AI Card -->
      <rect x="8" y="32" width="134" height="75" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <rect x="16" y="42" width="65" height="12" rx="3" fill="#a855f7" opacity="0.3" />
      <text x="20" y="51" font-family="sans-serif" font-size="8" fill="#d8b4fe">✨ AI COPILOT</text>
      <text x="16" y="68" font-family="sans-serif" font-weight="bold" font-size="9" fill="#f8fafc">Auto-summarize logs</text>
      <rect x="16" y="80" width="102" height="6" rx="3" fill="#334155" />
      <rect x="16" y="80" width="75" height="6" rx="3" fill="url(#p2Grad)" />
      <text x="16" y="98" font-family="sans-serif" font-size="8" fill="#94a3b8">75% completed</text>
    </g>

    <!-- Col 3: Completed -->
    <g transform="translate(350, 92)">
      <rect width="150" height="190" rx="8" fill="#182234" />
      <text x="12" y="22" font-family="sans-serif" font-weight="bold" font-size="10" fill="#34d399">DONE (8)</text>
      <!-- Done Card -->
      <rect x="8" y="32" width="134" height="65" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1" />
      <rect x="16" y="42" width="55" height="12" rx="3" fill="#059669" opacity="0.3" />
      <text x="20" y="51" font-family="sans-serif" font-size="8" fill="#34d399">DATABASE</text>
      <text x="16" y="68" font-family="sans-serif" font-weight="bold" font-size="9" fill="#94a3b8">Postgres migration</text>
      <circle cx="120" cy="78" r="6" fill="#10b981" />
      <path d="M117 78 L119 80 L124 75" fill="none" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>
</svg>
