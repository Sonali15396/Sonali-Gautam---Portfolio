<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="p1Shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="360" fill="#0f172a" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
  </g>

  <!-- Browser Window Frame Mockup -->
  <g transform="translate(40, 30)" filter="url(#p1Shadow)">
    <!-- Window Body -->
    <rect width="520" height="300" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Titlebar -->
    <path d="M0 14 C0 6.27 6.27 0 14 0 L506 0 C513.73 0 520 6.27 520 14 L520 38 L0 38 Z" fill="#090d16" />
    <circle cx="24" cy="19" r="5" fill="#ef4444" />
    <circle cx="42" cy="19" r="5" fill="#eab308" />
    <circle cx="60" cy="19" r="5" fill="#22c55e" />
    
    <!-- Search Bar in Header -->
    <rect x="130" y="10" width="260" height="18" rx="6" fill="#1e293b" />
    <text x="145" y="23" font-family="sans-serif" font-size="10" fill="#94a3b8">shopsphere-storefront.io/catalog</text>

    <!-- App Content Inside -->
    <!-- Hero Banner inside app -->
    <rect x="25" y="55" width="470" height="85" rx="8" fill="url(#p1Grad)" />
    <text x="45" y="88" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff">ShopSphere NextGen</text>
    <text x="45" y="108" font-family="sans-serif" font-size="11" fill="#e0e7ff">Ultra-fast Headless E-Commerce with Stripe &amp; Next.js</text>
    <rect x="45" y="118" width="90" height="15" rx="4" fill="#ffffff" />
    <text x="65" y="129" font-family="sans-serif" font-weight="bold" font-size="9" fill="#4f46e5">EXPLORE STORE</text>

    <!-- Product Grid Items -->
    <g transform="translate(25, 155)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="145" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="10" y="10" width="125" height="60" rx="4" fill="#334155" />
      <circle cx="72" cy="40" r="18" fill="#6366f1" opacity="0.8" />
      <rect x="10" y="80" width="80" height="8" rx="2" fill="#e2e8f0" />
      <rect x="10" y="94" width="40" height="8" rx="2" fill="#38bdf8" />
      <rect x="105" y="90" width="30" height="16" rx="4" fill="#4f46e5" />
      <text x="120" y="102" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">+</text>

      <!-- Item 2 -->
      <rect x="162" y="0" width="145" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="172" y="10" width="125" height="60" rx="4" fill="#334155" />
      <rect x="210" y="25" width="50" height="30" rx="4" fill="#06b6d4" opacity="0.8" />
      <rect x="172" y="80" width="85" height="8" rx="2" fill="#e2e8f0" />
      <rect x="172" y="94" width="45" height="8" rx="2" fill="#38bdf8" />
      <rect x="267" y="90" width="30" height="16" rx="4" fill="#4f46e5" />
      <text x="282" y="102" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">+</text>

      <!-- Item 3 -->
      <rect x="325" y="0" width="145" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="335" y="10" width="125" height="60" rx="4" fill="#334155" />
      <polygon points="397,25 417,55 377,55" fill="#ec4899" opacity="0.8" />
      <rect x="335" y="80" width="75" height="8" rx="2" fill="#e2e8f0" />
      <rect x="335" y="94" width="50" height="8" rx="2" fill="#38bdf8" />
      <rect x="430" y="90" width="30" height="16" rx="4" fill="#4f46e5" />
      <text x="445" y="102" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">+</text>
    </g>
  </g>
</svg>
